name: Build

on:
  push:
    branches: [main, agents/macos-support, 'agents/release-*']
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      package_run_id:
        description: 'Optional completed build run ID: verify its existing native packages without rebuilding'
        required: false
        default: ''
        type: string

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-editor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: editor-bundle
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: editor-bundle/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Check editor JavaScript syntax
        run: npm run check
      - name: Build editor bundle
        run: npm run build
      - name: Check generated bundle is current
        run: git -C .. diff --exit-code -- resources/editor/tiptap-bundle.js

  build:
    if: inputs.package_run_id == ''
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: Windows
            qt-host: windows
            qt-arch: win64_msvc2022_64
            cmake-options: '-G "Visual Studio 17 2022" -A x64'
          - os: macos-14
            platform: macOS
            qt-host: mac
            qt-arch: clang_64
            cmake-options: '-DCMAKE_OSX_ARCHITECTURES=arm64'
          - os: ubuntu-22.04
            platform: Linux
            qt-host: linux
            qt-arch: linux_gcc_64
            cmake-options: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up MSVC runtime deployment environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Linux build and desktop dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libgl1-mesa-dev libegl1-mesa-dev \
            libxcb-cursor0 libxkbcommon-x11-0 libxcb-xinerama0 libnss3 libasound2 \
            libxcomposite1 libxrandr2 libxtst6 libxdamage1 libgbm1 libfontconfig1 \
            libdbus-1-3 rpm

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: ${{ matrix.qt-host }}
          target: 'desktop'
          arch: ${{ matrix.qt-arch }}
          modules: 'qtwebengine qtwebchannel qtpositioning'

      - name: Configure
        run: cmake -S . -B build ${{ matrix.cmake-options }} -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        env:
          QTWEBENGINE_CHROMIUM_FLAGS: --disable-gpu
        run: ctest --test-dir build -C Release --output-on-failure --no-tests=error --output-junit test-results.xml

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-${{ matrix.platform }}-test-reports
          path: |
            build/*Test.txt
            build/test-results.xml
            build/tests/nexus-core.junit.xml
            build/Testing/Temporary/LastTest.log

      - name: Package with Qt runtime
        run: cpack --config build/CPackConfig.cmake -C Release

      - name: Package native Linux DEB and RPM
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          cmake --install build --config Release --prefix "$PWD/build/linux-stage"
          cmake -S packaging/native -B build/native-packages \
            -DNEXUS_STAGE="$PWD/build/linux-stage"
          cpack --config build/native-packages/CPackConfig.cmake
          cp build/native-packages/packages/*.deb build/native-packages/packages/*.rpm build/packages/

      - name: Build Windows installer from deployed runtime
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path -LiteralPath $iscc)) {
            choco install innosetup --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Inno Setup installation failed' }
          }
          cmake --install build --config Release --prefix "$PWD\build\stage"
          if ($LASTEXITCODE -ne 0) { throw 'Runtime deployment failed' }
          $version = [regex]::Match((Get-Content CMakeLists.txt -Raw),
            'project\(Nexus VERSION ([0-9.]+)').Groups[1].Value
          if (!$version) { throw 'Application version is missing' }
          & $iscc "/DMyAppVersion=$version" "/DMyAppSourceDir=$PWD\build\stage" `
            "/O$PWD\build\packages" installer\nexus-setup.iss
          if ($LASTEXITCODE -ne 0) { throw 'Windows installer creation failed' }

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-${{ matrix.platform }}
          path: |
            build/packages/*.zip
            build/packages/*.dmg
            build/packages/*.tar.gz
            build/packages/*.exe
            build/packages/*.deb
            build/packages/*.rpm
          if-no-files-found: error

  verify-installer:
    name: Verify ${{ matrix.platform }} installer and screenshots
    needs: build
    if: always() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.package_run_id != ''))
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macOS
          - os: ubuntu-22.04
            platform: Linux
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download native package
        uses: actions/download-artifact@v4
        with:
          name: Nexus-${{ matrix.platform }}
          path: installer-package
          run-id: ${{ inputs.package_run_id || github.run_id }}
          github-token: ${{ github.token }}

      - name: Install Linux desktop runtime (no development Qt)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth fluxbox dbus-x11 libxcb-cursor0 \
            libxkbcommon-x11-0 libxcb-xinerama0 libnss3 libasound2 libxcomposite1 \
            libxrandr2 libxtst6 libxdamage1 libgbm1 libfontconfig1 libdbus-1-3 \
            libgl1 libegl1 libopengl0 fonts-dejavu-core libxcb-icccm4 libxcb-keysyms1 \
            libxcb-image0 libxcb-render-util0 libxcb-randr0 libxcb-xfixes0 \
            libxcb-sync1 libxcb-xkb1 libxcb-shape0

      - name: Verify installed macOS DMG and capture screen
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          packages=(installer-package/*.dmg)
          test "${#packages[@]}" -eq 1
          python ci/verify_installer.py --package "${packages[0]}" --evidence installer-evidence

      - name: Verify installed Linux archive and capture virtual desktop
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          packages=(installer-package/*.tar.gz)
          test "${#packages[@]}" -eq 1
          xvfb-run -a -s "-screen 0 1600x1000x24" dbus-run-session -- \
            bash -c 'set -euo pipefail
              fluxbox > "$RUNNER_TEMP/nexus-window-manager.log" 2>&1 &
              wm_pid=$!
              trap "kill $wm_pid 2>/dev/null || true" EXIT
              python ci/verify_installer.py --package "$1" --evidence installer-evidence' \
            bash "${packages[0]}"

      - name: Collect window manager diagnostics
        if: always() && runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p installer-evidence
          if test -f "$RUNNER_TEMP/nexus-window-manager.log"; then
            cp "$RUNNER_TEMP/nexus-window-manager.log" installer-evidence/window-manager.log
          fi

      - name: Upload installer screenshots and diagnostics
        id: evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-${{ matrix.platform }}-installer-evidence
          path: installer-evidence/
          retention-days: 14
          if-no-files-found: warn

      - name: Link screenshot evidence in workflow summary
        if: always()
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          EVIDENCE_URL: ${{ steps.evidence.outputs.artifact-url }}
        run: |
          {
            echo "## ${PLATFORM} installer verification"
            if test -n "${EVIDENCE_URL}"; then
              echo "Download [screenshots and diagnostics](${EVIDENCE_URL})."
            else
              echo 'No evidence artifact was produced; inspect the failed job logs.'
            fi
            echo 'The artifact contains `screenshots/app-window.png`, `screenshots/desktop.png`,'
            echo '`screenshots/report.json`, `verification.json`, and install/application logs.'
            echo 'A failed job may have logs only; screenshots are evidence only when verification passes.'
          } >> "$GITHUB_STEP_SUMMARY"

  verify-native-linux:
    name: Verify ${{ matrix.platform }} package lifecycle
    needs: build
    if: always() && (needs.build.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.package_run_id != ''))
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: Ubuntu-22.04-DEB
            format: deb
            image: ''
          - os: ubuntu-24.04
            platform: Ubuntu-24.04-DEB
            format: deb
            image: ''
          - os: ubuntu-22.04
            platform: Fedora-43-RPM
            format: rpm
            image: fedora:43
          - os: ubuntu-22.04
            platform: Fedora-44-RPM
            format: rpm
            image: fedora:44
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: Nexus-Linux
          path: installer-package
          run-id: ${{ inputs.package_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Install DEB desktop test tools
        if: matrix.format == 'deb'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth fluxbox dbus-x11 fonts-dejavu-core
      - name: Install, reinstall, launch and remove DEB
        if: matrix.format == 'deb'
        shell: bash
        run: |
          set -euo pipefail
          packages=(installer-package/*.deb)
          test "${#packages[@]}" -eq 1
          xvfb-run -a -s "-screen 0 1600x1000x24" dbus-run-session -- \
            bash -c 'set -euo pipefail
              fluxbox > "$RUNNER_TEMP/nexus-native-window-manager.log" 2>&1 &
              wm_pid=$!
              trap "kill $wm_pid 2>/dev/null || true" EXIT
              python ci/verify_native_package.py --package "$1" --evidence installer-evidence' \
            bash "${packages[0]}"
      - name: Install, reinstall, launch and remove RPM on Fedora
        if: matrix.format == 'rpm'
        shell: bash
        env:
          FEDORA_IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          packages=(installer-package/*.rpm)
          test "${#packages[@]}" -eq 1
          docker run --rm -v "$PWD:/workspace" -w /workspace "$FEDORA_IMAGE" \
            bash ci/run_fedora_native.sh "${packages[0]}" installer-evidence
      - name: Upload native package lifecycle evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Nexus-${{ matrix.platform }}-installer-evidence
          path: installer-evidence/
          retention-days: 14
          if-no-files-found: warn

  release:
    name: Publish verified release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [validate-editor, build, verify-installer, verify-native-linux]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v4
        with:
          pattern: Nexus-*
          path: release-input

      - name: Prepare checked release assets and screenshots
        run: python ci/prepare_release.py --input release-input --output release-assets --tag "${{ github.ref_name }}"

      - name: Create release after native verification
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" --verify-tag --title "Nexus $RELEASE_TAG" \
            --notes-file "docs/release-notes-${RELEASE_TAG}.md" release-assets/*
